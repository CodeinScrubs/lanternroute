name: Bug report
description: Something is broken, leaking, or behaving unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please run **Doctor** first — most routing issues are explained by its output.
        Remove SOCKS credentials, subscription URLs, and private addresses from everything you paste.
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2 (26100.2314), x64
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LanternRoute version
      placeholder: e.g. v0.3.0 release ZIP, or commit hash if built from source
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: SOCKS upstream
      placeholder: e.g. v2rayN 7.x local SOCKS on 127.0.0.1:10808, UDP relay off
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - TCP-only
        - Full UDP (Doctor reported UDP relay yes)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste the full `Doctor` report (credentials removed).
      render: text
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: What happened and how to reproduce it
      description: Exact steps, what you expected, and what actually happened. Include GUI log lines or CLI output if relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Other network software
      description: VPNs, virtual adapters (Hyper-V/WSL/VirtualBox), firewalls, or other proxy tools running at the same time.
