[package]
name = "proxybridge-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Windows TUN-to-SOCKS whole-device proxy controller"
readme = "README.md"
keywords = ["proxy", "socks5", "tun", "windows", "networking"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
dirs = "6.0"
ipnet = "2.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.37"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell"
] }
zip = "4.3"

# Production binaries: link-time optimization and a single codegen unit for
# smaller, faster executables; strip symbols from the shipped release.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
